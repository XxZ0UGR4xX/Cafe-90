name: Seguridad de dependencias
# Aparte del CI principal: un aviso nuevo del registro no debe poner en rojo cada commit.
on:
  schedule: [{ cron: '23 6 * * 1' }]     # lunes
  workflow_dispatch: {}
  pull_request: { paths: ['pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/package.json'] }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades en dependencias de producción (falla con severidad alta o crítica)
        run: pnpm audit --prod --audit-level=high
