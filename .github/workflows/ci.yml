name: CI
on: { push: { branches: ['**'] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Roles y bases de prueba
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE ROLE retroburger_owner LOGIN PASSWORD 'owner_dev' CREATEDB"
          psql -h localhost -U postgres -c "CREATE ROLE retroburger_app LOGIN PASSWORD 'app_dev' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE retroburger_test OWNER retroburger_owner"
          psql -h localhost -U postgres -d retroburger_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gist;"
      - run: pnpm --filter @retroburger/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env: { REDIS_URL: 'redis://localhost:6379' }   # activa las pruebas de réplicas (rate-limit y WebSocket compartidos)
      - run: pnpm --filter @retroburger/web-admin build && pnpm --filter @retroburger/web-public build
  # Las imágenes de producción deben construir siempre (detecta Dockerfile/lockfile rotos antes de desplegar)
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        run: docker build -f apps/api/Dockerfile -t retroburger-api:ci .
      - name: Web admin
        run: docker build -f apps/web-admin/Dockerfile --build-arg APP=web-admin --build-arg VITE_API_URL=https://api.example.com -t retroburger-admin:ci .
      - name: Web pública
        run: docker build -f apps/web-admin/Dockerfile --build-arg APP=web-public --build-arg VITE_API_URL=https://api.example.com --build-arg VITE_TENANT=demo -t retroburger-public:ci .
      - name: La imagen de la API arranca (falla rápido si falta algo en tiempo de ejecución)
        run: docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgres://x:y@localhost:5432/z -e JWT_ACCESS_SECRET=ci-secret-ci-secret-ci-secret-1234 -e MFA_ENCRYPTION_KEY=ci-key-ci-key-ci-key-ci-key-ci-key-12 retroburger-api:ci node -e "require('./dist/config/env').loadEnv(); console.log('env OK')"
