global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: retroburger-api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs: [{ targets: ['api:3000'] }]
  # Disponibilidad vista desde fuera (opcional): añade un blackbox_exporter apuntando a https://api.tu-dominio.com/ready
